<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户系统 - 银行卡管理</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1890ff;
            --primary-hover: #40a9ff;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --danger-color: #ff4d4f;
            --text-primary: #262626;
            --text-secondary: #8c8c8c;
            --text-tertiary: #bfbfbf;
            --border-color: #e8e8e8;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 头部导航 */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #0050b3 100%);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
        }

        .header-back {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s;
        }

        .header-back:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 主内容区 */
        .main {
            flex: 1;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        /* 银行卡列表 */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .card-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .card-item.default::before {
            content: '默认';
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--primary-color);
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }

        .card-icon.icbc { background: #009de6; }
        .card-icon.cmb { background: #e5312e; }
        .card-icon.boc { background: #003399; }
        .card-icon.ccb { background: #009f3d; }

        .card-info {
            flex: 1;
        }

        .card-bank {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-type {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .card-number {
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .card-action {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .card-action:hover {
            background: #e6f7ff;
        }

        .card-action i {
            font-size: 16px;
            color: var(--text-secondary);
        }

        /* 添加银行卡入口 */
        .add-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 2px dashed var(--border-color);
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-card:hover {
            border-color: var(--primary-color);
            background: rgba(24, 144, 255, 0.02);
        }

        .add-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #e6f7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--primary-color);
        }

        .add-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* 安全提示 */
        .safety-tip {
            background: #fff7e6;
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
        }

        .safety-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .safety-icon {
            font-size: 16px;
            color: var(--warning-color);
        }

        .safety-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .safety-content {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* 操作菜单 */
        .action-menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .action-menu.show {
            display: flex;
        }

        .menu-content {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 16px 16px 0 0;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .menu-header {
            padding: 16px 20px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-item {
            padding: 16px 20px;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-item:last-child {
            border-bottom: none;
            color: var(--danger-color);
        }

        .menu-item:hover {
            background: var(--bg-color);
        }

        /* 添加银行卡弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 16px 16px 0 0;
            max-height: 80vh;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-label.required::after {
            content: '*';
            color: var(--danger-color);
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-block {
            width: 100%;
        }

        .bank-select {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .bank-item {
            padding: 12px 8px;
            background: var(--bg-color);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .bank-item.selected {
            border-color: var(--primary-color);
            background: #e6f7ff;
        }

        .bank-item:hover {
            border-color: var(--primary-color);
        }

        .bank-item i {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .bank-item span {
            font-size: 12px;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 头部 -->
        <header class="header">
            <div class="header-back" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="header-title">银行卡管理</div>
            <div style="width: 36px;"></div>
        </header>

        <!-- 主内容区 -->
        <main class="main">
            <!-- 银行卡列表 -->
            <div class="card-list">
                <div class="card-item default" onclick="showCardMenu(this)">
                    <div class="card-icon icbc">
                        <i class="fas fa-credit-card"></i>
                    </div>
                    <div class="card-info">
                        <div class="card-bank">中国工商银行</div>
                        <div class="card-type">储蓄卡</div>
                        <div class="card-number">**** **** **** 4582</div>
                    </div>
                    <div class="card-action">
                        <i class="fas fa-ellipsis-v"></i>
                    </div>
                </div>

                <div class="card-item" onclick="showCardMenu(this)">
                    <div class="card-icon cmb">
                        <i class="fas fa-credit-card"></i>
                    </div>
                    <div class="card-info">
                        <div class="card-bank">招商银行</div>
                        <div class="card-type">信用卡</div>
                        <div class="card-number">**** **** **** 1234</div>
                    </div>
                    <div class="card-action">
                        <i class="fas fa-ellipsis-v"></i>
                    </div>
                </div>
            </div>

            <!-- 添加银行卡 -->
            <div class="add-card" onclick="showAddCard()">
                <div class="add-icon">
                    <i class="fas fa-plus"></i>
                </div>
                <div class="add-text">添加银行卡</div>
            </div>

            <!-- 安全提示 -->
            <div class="safety-tip">
                <div class="safety-header">
                    <i class="fas fa-shield-alt safety-icon"></i>
                    <span class="safety-title">安全提示</span>
                </div>
                <div class="safety-content">
                    1. 请确保绑定的银行卡为本人所有<br>
                    2. 银行卡预留手机号需与本账户一致<br>
                    3. 最多可绑定5张银行卡<br>
                    4. 解绑银行卡需验证支付密码
                </div>
            </div>
        </main>
    </div>

    <!-- 操作菜单 -->
    <div class="action-menu" id="actionMenu">
        <div class="menu-content">
            <div class="menu-header">操作菜单</div>
            <div class="menu-item" onclick="setDefaultCard()">设为默认卡</div>
            <div class="menu-item" onclick="showCardDetail()">查看详情</div>
            <div class="menu-item" onclick="unbindCard()">解除绑定</div>
            <div class="menu-item" onclick="closeActionMenu()">取消</div>
        </div>
    </div>

    <!-- 添加银行卡弹窗 -->
    <div class="modal" id="addCardModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>添加银行卡</span>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label required">选择银行</label>
                    <div class="bank-select">
                        <div class="bank-item selected" onclick="selectBank(this)">
                            <i class="fas fa-university" style="color: #009de6;"></i>
                            <span>工商银行</span>
                        </div>
                        <div class="bank-item" onclick="selectBank(this)">
                            <i class="fas fa-university" style="color: #009f3d;"></i>
                            <span>建设银行</span>
                        </div>
                        <div class="bank-item" onclick="selectBank(this)">
                            <i class="fas fa-university" style="color: #e5312e;"></i>
                            <span>招商银行</span>
                        </div>
                        <div class="bank-item" onclick="selectBank(this)">
                            <i class="fas fa-university" style="color: #003399;"></i>
                            <span>中国银行</span>
                        </div>
                        <div class="bank-item" onclick="selectBank(this)">
                            <i class="fas fa-university" style="color: #91c46b;"></i>
                            <span>农业银行</span>
                        </div>
                        <div class="bank-item" onclick="selectBank(this)">
                            <i class="fas fa-university" style="color: #00b4ef;"></i>
                            <span>交通银行</span>
                        </div>
                        <div class="bank-item" onclick="selectBank(this)">
                            <i class="fas fa-university" style="color: #6a2e75;"></i>
                            <span>浦发银行</span>
                        </div>
                        <div class="bank-item" onclick="selectBank(this)">
                            <i class="fas fa-university" style="color: #e23d47;"></i>
                            <span>民生银行</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label required">卡号</label>
                    <input type="text" class="form-input" placeholder="请输入银行卡号" maxlength="19">
                    <div class="form-hint">请输入16-19位银行卡号</div>
                </div>

                <div class="form-group">
                    <label class="form-label required">持卡人姓名</label>
                    <input type="text" class="form-input" placeholder="请输入持卡人姓名">
                    <div class="form-hint">需与银行卡开户姓名一致</div>
                </div>

                <div class="form-group">
                    <label class="form-label required">银行预留手机号</label>
                    <input type="text" class="form-input" placeholder="请输入银行预留手机号">
                    <div class="form-hint">用于接收验证码</div>
                </div>

                <div class="form-group">
                    <label class="form-label">安全码（信用卡必填）</label>
                    <input type="text" class="form-input" placeholder="请输入安全码">
                    <div class="form-hint">信用卡背面签名栏后三位数字</div>
                </div>

                <div class="form-group">
                    <label class="form-label">有效期（信用卡必填）</label>
                    <input type="text" class="form-input" placeholder="MM/YY">
                    <div class="form-hint">格式如：12/25</div>
                </div>

                <button class="btn btn-primary btn-block" onclick="submitAddCard()">下一步</button>
            </div>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = 'user-home.html';
        }

        function showCardMenu(item) {
            document.getElementById('actionMenu').classList.add('show');
        }

        function closeActionMenu() {
            document.getElementById('actionMenu').classList.remove('show');
        }

        function showAddCard() {
            document.getElementById('addCardModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('addCardModal').classList.remove('show');
        }

        function selectBank(item) {
            document.querySelectorAll('.bank-item').forEach(bank => {
                bank.classList.remove('selected');
            });
            item.classList.add('selected');
        }

        function setDefaultCard() {
            closeActionMenu();
            showToast('已设为默认卡');
        }

        function showCardDetail() {
            closeActionMenu();
            showToast('银行卡详情');
        }

        function unbindCard() {
            if (confirm('确定要解绑这张银行卡吗？')) {
                closeActionMenu();
                showToast('解绑成功');
            }
        }

        function submitAddCard() {
            showLoading();
            setTimeout(() => {
                hideLoading();
                closeModal();
                showToast('绑定成功');
            }, 1500);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 80px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                z-index: 1001;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }

        function showLoading() {
            const loading = document.createElement('div');
            loading.id = 'loading';
            loading.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.5);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1002;
            `;
            loading.innerHTML = `<div style="width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite;"></div>`;
            document.body.appendChild(loading);
            
            const style = document.createElement('style');
            style.textContent = `@keyframes spin { to { transform: rotate(360deg); } }`;
            document.head.appendChild(style);
        }

        function hideLoading() {
            document.getElementById('loading')?.remove();
        }

        document.getElementById('actionMenu').addEventListener('click', function(e) {
            if (e.target === this) {
                closeActionMenu();
            }
        });

        document.getElementById('addCardModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
