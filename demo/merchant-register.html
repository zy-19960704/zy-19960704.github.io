<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商户入驻申请</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1890ff;
            --primary-hover: #40a9ff;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --danger-color: #ff4d4f;
            --text-primary: #262626;
            --text-secondary: #8c8c8c;
            --text-tertiary: #bfbfbf;
            --border-color: #e8e8e8;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .app {
            min-height: 100vh;
            display: flex;
        }

        /* 侧边栏 */
        .sidebar {
            width: 240px;
            background: linear-gradient(180deg, #001529 0%, #000c17 100%);
            color: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-brand {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-logo {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo i {
            font-size: 28px;
            color: var(--primary-color);
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
            margin-top: 4px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
        }

        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.65);
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: white;
            background: rgba(24, 144, 255, 0.15);
            border-left-color: var(--primary-color);
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .merchant-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .merchant-avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .merchant-detail {
            flex: 1;
        }

        .merchant-name {
            font-weight: 500;
            font-size: 14px;
        }

        .merchant-status {
            font-size: 12px;
            color: var(--success-color);
        }

        /* 主内容区 */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: white;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .main {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        /* 步骤条 */
        .steps {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            padding: 0 60px;
        }

        .step {
            display: flex;
            align-items: center;
            flex: 1;
            max-width: 280px;
        }

        .step-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--border-color);
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .step.active .step-circle {
            background: var(--primary-color);
            color: white;
        }

        .step.completed .step-circle {
            background: var(--success-color);
            color: white;
        }

        .step-label {
            font-size: 14px;
            color: var(--text-tertiary);
            transition: all 0.3s;
        }

        .step.active .step-label {
            color: var(--primary-color);
            font-weight: 500;
        }

        .step.completed .step-label {
            color: var(--success-color);
        }

        .step-line {
            flex: 1;
            height: 2px;
            background: var(--border-color);
            margin: 0 16px;
            margin-top: -20px;
            transition: all 0.3s;
        }

        .step.completed + .step .step-line,
        .step.completed .step-line {
            background: var(--success-color);
        }

        /* 表单卡片 */
        .form-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 32px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .form-section {
            margin-bottom: 32px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .form-section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-section-title i {
            color: var(--primary-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-label.required::after {
            content: '*';
            color: var(--danger-color);
            margin-left: 4px;
        }

        .form-input {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 文件上传 */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: rgba(24, 144, 255, 0.02);
        }

        .upload-icon {
            font-size: 48px;
            color: var(--text-tertiary);
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .upload-hint {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .upload-preview {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .upload-item {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .upload-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-item-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .upload-item:hover .upload-item-remove {
            opacity: 1;
        }

        /* 结算配置 */
        .radio-group {
            display: flex;
            gap: 24px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .radio-item input {
            display: none;
        }

        .radio-item input:checked + .radio-circle {
            border-color: var(--primary-color);
        }

        .radio-item input:checked + .radio-circle::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary-color);
        }

        /* 按钮 */
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-dashed {
            background: transparent;
            color: var(--primary-color);
            border: 1px dashed var(--primary-color);
        }

        .btn-dashed:hover {
            background: rgba(24, 144, 255, 0.05);
        }

        .form-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* 提交成功提示 */
        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .success-modal.show {
            display: flex;
        }

        .success-content {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f6ffed;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon i {
            font-size: 40px;
            color: var(--success-color);
        }

        .success-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .success-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .success-info {
            background: var(--bg-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }

        .success-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .success-info-item:last-child {
            margin-bottom: 0;
        }

        .success-info-label {
            color: var(--text-secondary);
        }

        .success-info-value {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Toast提示 -->
        <div class="toast" id="toast"></div>

        <!-- 提交成功提示 -->
        <div class="success-modal" id="successModal">
            <div class="success-content">
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <div class="success-title">提交成功</div>
                <div class="success-desc">您的入驻申请已提交，请等待审核</div>
                <div class="success-info">
                    <div class="success-info-item">
                        <span class="success-info-label">申请编号</span>
                        <span class="success-info-value" id="applyNo">MER202605220001</span>
                    </div>
                    <div class="success-info-item">
                        <span class="success-info-label">预计审核</span>
                        <span class="success-info-value">1-3个工作日</span>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="closeSuccessModal()">知道了</button>
            </div>
        </div>

        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-logo">
                    <i class="fas fa-shield-alt"></i>
                    <span>支付系统</span>
                </div>
                <div class="sidebar-subtitle">商户管理平台</div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-item" onclick="goHome()">
                    <i class="fas fa-home"></i>
                    <span>首页</span>
                </div>
                <div class="nav-item active">
                    <i class="fas fa-user-plus"></i>
                    <span>商户入驻</span>
                </div>
                <div class="nav-item" onclick="showDashboard()">
                    <i class="fas fa-chart-line"></i>
                    <span>数据看板</span>
                </div>
                <div class="nav-item" onclick="showTransactions()">
                    <i class="fas fa-exchange-alt"></i>
                    <span>交易管理</span>
                </div>
                <div class="nav-item" onclick="showSettlement()">
                    <i class="fas fa-wallet"></i>
                    <span>结算管理</span>
                </div>
                <div class="nav-item" onclick="showSettings()">
                    <i class="fas fa-cog"></i>
                    <span>账户设置</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="merchant-info">
                    <div class="merchant-avatar">
                        <i class="fas fa-store"></i>
                    </div>
                    <div class="merchant-detail">
                        <div class="merchant-name">未入驻</div>
                        <div class="merchant-status">请先完成入驻</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <div class="main-wrapper">
            <header class="header">
                <h1 class="header-title">商户入驻申请</h1>
                <div class="header-actions">
                    <span style="font-size: 14px; color: var(--text-secondary);">已有账号？<a href="#" style="color: var(--primary-color);">立即登录</a></span>
                </div>
            </header>

            <main class="main">
                <!-- 步骤条 -->
                <div class="steps">
                    <div class="step active" id="step1">
                        <div class="step-content">
                            <div class="step-circle">1</div>
                            <div class="step-label">企业信息</div>
                        </div>
                        <div class="step-line"></div>
                    </div>
                    <div class="step" id="step2">
                        <div class="step-content">
                            <div class="step-circle">2</div>
                            <div class="step-label">法人信息</div>
                        </div>
                        <div class="step-line"></div>
                    </div>
                    <div class="step" id="step3">
                        <div class="step-content">
                            <div class="step-circle">3</div>
                            <div class="step-label">结算信息</div>
                        </div>
                        <div class="step-line"></div>
                    </div>
                    <div class="step" id="step4">
                        <div class="step-content">
                            <div class="step-circle">4</div>
                            <div class="step-label">提交审核</div>
                        </div>
                    </div>
                </div>

                <!-- 表单卡片 -->
                <div class="form-card">
                    <form id="merchantForm">
                        <!-- 第一步：企业信息 -->
                        <div class="form-section" id="section1">
                            <div class="form-section-title">
                                <i class="fas fa-building"></i>
                                企业基本信息
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">企业名称</label>
                                    <input type="text" class="form-input" id="companyName" placeholder="请输入企业全称">
                                </div>
                                <div class="form-group">
                                    <label class="form-label required">统一社会信用代码</label>
                                    <input type="text" class="form-input" id="creditCode" placeholder="请输入18位信用代码">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">企业类型</label>
                                    <select class="form-input" id="companyType">
                                        <option value="">请选择</option>
                                        <option value="1">有限责任公司</option>
                                        <option value="2">股份有限公司</option>
                                        <option value="3">个人独资企业</option>
                                        <option value="4">合伙企业</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label required">注册资本</label>
                                    <input type="text" class="form-input" id="capital" placeholder="请输入注册资本（万元）">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">所属行业</label>
                                    <select class="form-input" id="industry">
                                        <option value="">请选择</option>
                                        <option value="1">零售/批发</option>
                                        <option value="2">餐饮</option>
                                        <option value="3">住宿/旅游</option>
                                        <option value="4">教育</option>
                                        <option value="5">医疗健康</option>
                                        <option value="6">其他</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label required">经营地址</label>
                                    <input type="text" class="form-input" id="address" placeholder="请输入详细经营地址">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">营业执照</label>
                                    <div class="upload-area" onclick="document.getElementById('licenseUpload').click()">
                                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                                        <div class="upload-text">点击上传营业执照</div>
                                        <div class="upload-hint">支持 JPG、PNG 格式，大小不超过 5MB</div>
                                        <input type="file" id="licenseUpload" style="display: none;" accept="image/*" onchange="handleUpload(this)">
                                    </div>
                                    <div class="upload-preview" id="licensePreview"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 第二步：法人信息 -->
                        <div class="form-section" id="section2" style="display: none;">
                            <div class="form-section-title">
                                <i class="fas fa-user-tie"></i>
                                法人代表信息
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">法人姓名</label>
                                    <input type="text" class="form-input" id="legalName" placeholder="请输入法人姓名">
                                </div>
                                <div class="form-group">
                                    <label class="form-label required">身份证号</label>
                                    <input type="text" class="form-input" id="legalIdCard" placeholder="请输入18位身份证号">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">手机号码</label>
                                    <input type="text" class="form-input" id="legalPhone" placeholder="请输入手机号码">
                                </div>
                                <div class="form-group">
                                    <label class="form-label required">电子邮箱</label>
                                    <input type="email" class="form-input" id="legalEmail" placeholder="请输入电子邮箱">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">身份证正面</label>
                                    <div class="upload-area" onclick="document.getElementById('idCardFrontUpload').click()">
                                        <i class="fas fa-id-card upload-icon"></i>
                                        <div class="upload-text">上传身份证人像面</div>
                                        <div class="upload-hint">支持 JPG、PNG 格式，大小不超过 5MB</div>
                                        <input type="file" id="idCardFrontUpload" style="display: none;" accept="image/*" onchange="handleUpload(this)">
                                    </div>
                                    <div class="upload-preview" id="idCardFrontPreview"></div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label required">身份证背面</label>
                                    <div class="upload-area" onclick="document.getElementById('idCardBackUpload').click()">
                                        <i class="fas fa-id-card upload-icon"></i>
                                        <div class="upload-text">上传身份证国徽面</div>
                                        <div class="upload-hint">支持 JPG、PNG 格式，大小不超过 5MB</div>
                                        <input type="file" id="idCardBackUpload" style="display: none;" accept="image/*" onchange="handleUpload(this)">
                                    </div>
                                    <div class="upload-preview" id="idCardBackPreview"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 第三步：结算信息 -->
                        <div class="form-section" id="section3" style="display: none;">
                            <div class="form-section-title">
                                <i class="fas fa-wallet"></i>
                                结算账户信息
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">对公账户名称</label>
                                    <input type="text" class="form-input" id="bankAccountName" placeholder="请输入对公账户名称">
                                </div>
                                <div class="form-group">
                                    <label class="form-label required">对公账号</label>
                                    <input type="text" class="form-input" id="bankAccountNo" placeholder="请输入对公账号">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">开户银行</label>
                                    <select class="form-input" id="bankCode">
                                        <option value="">请选择开户银行</option>
                                        <option value="ICBC">中国工商银行</option>
                                        <option value="ABC">中国农业银行</option>
                                        <option value="BOC">中国银行</option>
                                        <option value="CCB">中国建设银行</option>
                                        <option value="COMM">交通银行</option>
                                        <option value="CMB">招商银行</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label required">开户支行</label>
                                    <input type="text" class="form-input" id="bankBranch" placeholder="请输入开户支行名称">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">结算周期</label>
                                    <div class="radio-group">
                                        <label class="radio-item">
                                            <input type="radio" name="settleCycle" value="T1" checked>
                                            <span class="radio-circle"></span>
                                            <span>T+1 结算</span>
                                        </label>
                                        <label class="radio-item">
                                            <input type="radio" name="settleCycle" value="T0">
                                            <span class="radio-circle"></span>
                                            <span>D+0 实时结算</span>
                                        </label>
                                    </div>
                                    <div class="form-hint">D+0 结算费率略高于 T+1</div>
                                </div>
                            </div>
                        </div>

                        <!-- 第四步：联系人信息 -->
                        <div class="form-section" id="section4" style="display: none;">
                            <div class="form-section-title">
                                <i class="fas fa-address-book"></i>
                                联系人信息
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">联系人姓名</label>
                                    <input type="text" class="form-input" id="contactName" placeholder="请输入联系人姓名">
                                </div>
                                <div class="form-group">
                                    <label class="form-label required">联系人手机</label>
                                    <input type="text" class="form-input" id="contactPhone" placeholder="请输入联系人手机">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label required">电子邮箱</label>
                                    <input type="email" class="form-input" id="contactEmail" placeholder="用于接收审核通知">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">紧急联系电话</label>
                                    <input type="text" class="form-input" id="emergencyPhone" placeholder="选填">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">补充说明</label>
                                <textarea class="form-input" id="remark" rows="3" placeholder="如有特殊需求请在此说明"></textarea>
                            </div>
                        </div>

                        <!-- 表单操作 -->
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="prevBtn" style="display: none;" onclick="prevStep()">
                                <i class="fas fa-arrow-left"></i> 上一步
                            </button>
                            <button type="button" class="btn btn-primary" id="nextBtn" onclick="nextStep()">
                                下一步 <i class="fas fa-arrow-right"></i>
                            </button>
                            <button type="button" class="btn btn-primary" id="submitBtn" style="display: none;" onclick="submitForm()">
                                <i class="fas fa-paper-plane"></i> 提交申请
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 4;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function updateSteps() {
            for (let i = 1; i <= totalSteps; i++) {
                const step = document.getElementById('step' + i);
                const section = document.getElementById('section' + i);
                
                if (i < currentStep) {
                    step.className = 'step completed';
                } else if (i === currentStep) {
                    step.className = 'step active';
                } else {
                    step.className = 'step';
                }
                
                section.style.display = i === currentStep ? 'block' : 'none';
            }

            document.getElementById('prevBtn').style.display = currentStep > 1 ? 'inline-flex' : 'none';
            document.getElementById('nextBtn').style.display = currentStep < totalSteps ? 'inline-flex' : 'none';
            document.getElementById('submitBtn').style.display = currentStep === totalSteps ? 'inline-flex' : 'none';
        }

        function validateStep(step) {
            if (step === 1) {
                const companyName = document.getElementById('companyName').value;
                const creditCode = document.getElementById('creditCode').value;
                if (!companyName || !creditCode) {
                    showToast('请填写完整的企业信息');
                    return false;
                }
            } else if (step === 2) {
                const legalName = document.getElementById('legalName').value;
                const legalIdCard = document.getElementById('legalIdCard').value;
                if (!legalName || !legalIdCard) {
                    showToast('请填写完整的法人信息');
                    return false;
                }
            } else if (step === 3) {
                const bankAccountNo = document.getElementById('bankAccountNo').value;
                if (!bankAccountNo) {
                    showToast('请填写结算账户信息');
                    return false;
                }
            } else if (step === 4) {
                const contactName = document.getElementById('contactName').value;
                const contactPhone = document.getElementById('contactPhone').value;
                if (!contactName || !contactPhone) {
                    showToast('请填写联系人信息');
                    return false;
                }
            }
            return true;
        }

        function nextStep() {
            if (!validateStep(currentStep)) {
                return;
            }
            
            if (currentStep < totalSteps) {
                currentStep++;
                updateSteps();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateSteps();
            }
        }

        function handleUpload(input) {
            if (input.files && input.files[0]) {
                const previewId = input.id.replace('Upload', 'Preview');
                const preview = document.getElementById(previewId);
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `
                        <div class="upload-item">
                            <img src="${e.target.result}" alt="预览">
                            <div class="upload-item-remove" onclick="removeUpload('${previewId}', event)">
                                <i class="fas fa-times"></i>
                            </div>
                        </div>
                    `;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeUpload(previewId, event) {
            event.stopPropagation();
            document.getElementById(previewId).innerHTML = '';
        }

        function submitForm() {
            if (!validateStep(currentStep)) {
                return;
            }

            document.getElementById('applyNo').textContent = 'MER' + new Date().getTime().toString().slice(-12);
            document.getElementById('successModal').classList.add('show');
        }

        function closeSuccessModal() {
            document.getElementById('successModal').classList.remove('show');
            showToast('申请已提交，请耐心等待审核');
        }

        function goHome() {
            showToast('返回首页');
        }

        function showDashboard() {
            showToast('数据看板');
        }

        function showTransactions() {
            showToast('交易管理');
        }

        function showSettlement() {
            showToast('结算管理');
        }

        function showSettings() {
            showToast('账户设置');
        }
    </script>
</body>
</html>
